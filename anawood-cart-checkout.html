<!doctype html>
<html lang="vi" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Anawood – Cart/Checkout Desktop</title>
<style>
[data-theme="light"]{--bg:#fffdf9;--text:#1f2937;--muted:#6b7280;--brand:#c98f4a;--brand-dark:#a87436;--mint:#eaf7f1;--card:#fff;--line:#eee7de}
[data-theme="dark"]{--bg:#0f0f1a;--text:#e2e8f0;--muted:#94a3b8;--brand:#d4a05a;--brand-dark:#c98f4a;--mint:#1a2e2a;--card:#1a1a2e;--line:#2d2d44}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)} .container{max-width:1200px;margin:0 auto;padding:0 40px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line)} .nav{height:78px;display:flex;justify-content:space-between;align-items:center}.theme{width:40px;height:40px;border:none;border-radius:999px;background:var(--mint);cursor:pointer}
.btn{padding:12px 16px;border-radius:12px;border:none;cursor:pointer;text-decoration:none;font-weight:700;display:inline-block}.btn-primary{background:var(--brand);color:#fff}
.layout{display:grid;grid-template-columns:1.35fr .9fr;gap:22px;padding:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.item{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .item:last-child{border-bottom:0}
.item img{width:92px;height:92px;object-fit:cover;border-radius:10px}.name{font-weight:700}.muted{color:var(--muted);font-size:14px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:28px;height:28px;border:1px solid var(--line);background:transparent;border-radius:8px;color:var(--text)}
.row{display:flex;justify-content:space-between;padding:8px 0}.total{font-size:22px;font-weight:800;color:#b45309}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .full{grid-column:1/-1} input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.pay{display:flex;gap:10px}.pay div{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}.pay .active{border-color:var(--brand);background:var(--mint)}
@media(max-width:900px){.container{padding:0 18px}.layout{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style></head><body>
<header><div class="container nav"><strong>ANAWOOD</strong><div style="display:flex;gap:10px;align-items:center"><button class="theme" id="themeBtn" onclick="toggleTheme()">🌙</button><a class="btn" href="anawood-redesign-prototype.html">🏠 Trang chủ</a></div></div></header>
<div class="container layout">
  <div class="card"><h2>🛒 Giỏ hàng</h2>
    <div class="item"><img src="https://anawood.vn/wp-content/uploads/2026/03/642784678_1457644833038951_1380078216724023484_n.jpg"><div><div class="name">Giường EB091</div><div class="muted">Màu gỗ · 120x200</div></div><div><div class="qty"><button>-</button><strong>1</strong><button>+</button></div><div style="font-weight:700;color:#b45309;margin-top:6px">8.950.000 ₫</div></div></div>
    <div class="item"><img src="https://anawood.vn/wp-content/uploads/2026/03/z7673352958579_d7ca4d0a6573216624caa84cbf8ea87c.jpg"><div><div class="name">Thang Pikler</div><div class="muted">Bản chuẩn</div></div><div><div class="qty"><button>-</button><strong>1</strong><button>+</button></div><div style="font-weight:700;color:#b45309;margin-top:6px">3.250.000 ₫</div></div></div>
  </div>
  <div class="card"><h3>📋 Thanh toán</h3>
    <div class="row"><span>Tạm tính</span><strong>12.200.000 ₫</strong></div><div class="row"><span>Phí ship</span><span style="color:#059669">Miễn phí</span></div><div class="row"><span>Giảm giá</span><span>0 ₫</span></div><hr style="border:none;border-top:1px solid var(--line)"><div class="row"><span>Tổng cộng</span><span class="total">12.200.000 ₫</span></div>
    <div class="form" style="margin-top:12px">
      <input placeholder="Họ tên"><input placeholder="Số điện thoại"><input class="full" placeholder="Email"><input class="full" placeholder="Địa chỉ giao hàng"><select><option>Hà Nội</option><option>TP.HCM</option></select><select><option>Giao tận nơi</option><option>Nhận tại showroom</option></select><textarea class="full" rows="2" placeholder="Ghi chú"></textarea>
    </div>
    <div class="pay" style="margin-top:12px"><div class="active">💵 COD</div><div>🏦 Chuyển khoản</div></div>
    <a class="btn btn-primary" href="anawood-order-confirmation.html" style="width:100%;margin-top:14px;text-align:center">✅ Đặt hàng</a>
  </div>
</div>
<script>function toggleTheme(){const h=document.documentElement;const n=h.getAttribute('data-theme')==='light'?'dark':'light';h.setAttribute('data-theme',n);localStorage.setItem('anawood-theme',n);themeBtn.textContent=n==='light'?'🌙':'☀️'}(()=>{const s=localStorage.getItem('anawood-theme')||'light';document.documentElement.setAttribute('data-theme',s);themeBtn.textContent=s==='light'?'🌙':'☀️'})()</script>
</body></html>
